name: FastNNUE CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - name: Preprocess sample
        run: ./build/nnue_train preprocess --input data/sample.epd --output /tmp/sample.nnueb
      - name: Train 5 smoke epochs
        run: |
          ./build/nnue_train train \
            --data /tmp/sample.nnueb \
            --checkpoint /tmp/checkpoint.bin \
            --export /tmp/net.nnue \
            --metrics /tmp/metrics.csv \
            --epochs 5 \
            --epoch-samples 256 \
            --threads 2 \
            --minutes 2 \
            --save-every 1
